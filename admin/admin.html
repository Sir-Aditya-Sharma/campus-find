<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFind Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f5fb;
      color: #172554;
      font: 14px/1.5 Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px max(18px, calc((100% - 1100px) / 2));
      background: white;
      border-bottom: 1px solid #dbe3f4;
    }

    header a,
    a {
      color: #5145ed;
    }

    main {
      width: min(1100px, calc(100% - 28px));
      margin: 26px auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .muted {
      color: #52627d;
    }

    .panel {
      margin: 18px 0;
      padding: 18px;
      overflow-x: auto;
      border: 1px solid #dbe3f4;
      border-radius: 14px;
      background: white;
    }

    .login-panel {
      width: min(100%, 420px);
      margin: 24px auto;
    }

    label {
      display: block;
      margin: 12px 0 5px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }

    button {
      margin: 3px;
      padding: 8px 11px;
      border: 0;
      border-radius: 7px;
      background: #5145ed;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(.94);
    }

    button:disabled {
      cursor: wait;
      opacity: .6;
    }

    button.red {
      background: #b42318;
    }

    button.gray {
      background: #52627d;
    }

    .message {
      margin: 12px 0;
      padding: 10px;
      border-radius: 8px;
      background: #eef2ff;
      color: #27356a;
      overflow-wrap: anywhere;
    }

    .message.error {
      background: #fee4e2;
      color: #b42318;
    }

    .message.success {
      background: #dcfae6;
      color: #067647;
    }

    .hidden {
      display: none !important;
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #e5eaf4;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #eef2ff;
    }

    .actions {
      min-width: 230px;
    }

    .status {
      font-weight: 700;
    }
  </style>
</head>

<body>
  <header>
    <strong>CampusFind Admin</strong>
    <a href="/">Open CampusFind</a>
  </header>

  <main>
    <section id="loginPanel" class="panel login-panel">
      <h1>Admin login</h1>
      <p class="muted">Admin account se sign in karo.</p>

      <div id="loginMessage" class="message hidden"></div>

      <form id="loginForm">
        <label for="adminEmail">Admin email</label>
        <input
          id="adminEmail"
          type="email"
          autocomplete="username"
          required
        >

        <label for="adminPassword">Password</label>
        <input
          id="adminPassword"
          type="password"
          autocomplete="current-password"
          required
        >

        <button id="loginButton" type="submit">Login</button>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <h1>Admin dashboard</h1>
      <p class="muted">
        Account requests aur item reports yahan review karo.
      </p>
      <p id="dashboardMessage" class="message">Loading…</p>

      <section class="panel">
        <h2>Student account requests</h2>
        <div id="users">Loading accounts…</div>
      </section>

      <section class="panel">
        <h2>Item reports</h2>
        <div id="reports">Loading reports…</div>
      </section>

      <button id="logoutButton" class="gray" type="button">Logout admin</button>
    </section>
  </main>

  <script>
    const API_BASE = "https://campus-find-hmyj.onrender.com";

    const loginPanel = document.getElementById("loginPanel");
    const dashboard = document.getElementById("dashboard");
    const loginMessage = document.getElementById("loginMessage");
    const dashboardMessage = document.getElementById("dashboardMessage");

    function showMessage(element, text, type = "") {
      element.textContent = text;
      element.className = "message" + (type ? " " + type : "");
    }

    function getToken() {
      return localStorage.getItem("campusFindToken") || "";
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    async function apiRequest(path, options = {}) {
      const response = await fetch(API_BASE + path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(getToken()
            ? { Authorization: "Bearer " + getToken() }
            : {}),
          ...(options.headers || {})
        }
      });

      const text = await response.text();
      let data = {};

      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        data = { message: text || "Unexpected server response." };
      }

      if (!response.ok) {
        throw new Error(data.message || "Request failed.");
      }

      return data;
    }

    async function login(email, password) {
      const result = await apiRequest("/api/auth/login", {
        method: "POST",
        body: JSON.stringify({ email, password })
      });

      if (!result.user || !result.user.isAdmin) {
        throw new Error("Is account ko admin access nahi hai.");
      }

      localStorage.setItem("campusFindToken", result.token);
      localStorage.setItem("campusFindUser", JSON.stringify(result.user));

      await openDashboard();
    }

    async function loadUsers() {
      const users = await apiRequest("/api/auth/admin/users");
      const container = document.getElementById("users");

      if (!users.length) {
        container.textContent = "Koi account request nahi hai.";
        return;
      }

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${users.map(user => `
              <tr>
                <td>${escapeHTML(user.name)}</td>
                <td>${escapeHTML(user.email)}</td>
                <td>${escapeHTML(user.phone || "—")}</td>
                <td class="status">${escapeHTML(user.accountStatus)}</td>
                <td class="actions">
                  <button
                    type="button"
                    data-user-id="${escapeHTML(user._id)}"
                    data-account-status="Approved"
                  >Approve</button>
                  <button
                    class="red"
                    type="button"
                    data-user-id="${escapeHTML(user._id)}"
                    data-account-status="Rejected"
                  >Reject</button>
                  <button
                    class="gray"
                    type="button"
                    data-user-id="${escapeHTML(user._id)}"
                    data-account-status="Disabled"
                  >Disable</button>
                  <button
                    type="button"
                    data-reset-user="${escapeHTML(user._id)}"
                  >Reset password</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    async function loadReports() {
      const items = await apiRequest("/api/items/admin/all");
      const container = document.getElementById("reports");

      if (!items.length) {
        container.textContent = "Koi report nahi hai.";
        return;
      }

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Type</th>
              <th>Student</th>
              <th>Course / Department</th>
              <th>Location</th>
              <th>Review</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(item => `
              <tr>
                <td>${escapeHTML(item.itemName)}</td>
                <td>${escapeHTML(item.type)}</td>
                <td>${escapeHTML(item.studentName)}</td>
                <td>
                  ${escapeHTML(item.course)} /
                  ${escapeHTML(item.department)}<br>
                  Batch: ${escapeHTML(item.batch)}<br>
                  ${escapeHTML(item.semester)}
                </td>
                <td>${escapeHTML(item.location)}</td>
                <td class="status">${escapeHTML(item.reviewStatus)}</td>
                <td class="actions">
                  <button
                    type="button"
                    data-item-id="${escapeHTML(item._id)}"
                    data-review-status="Approved"
                  >Approve</button>
                  <button
                    class="red"
                    type="button"
                    data-item-id="${escapeHTML(item._id)}"
                    data-review-status="Rejected"
                  >Reject</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    async function openDashboard() {
      loginPanel.classList.add("hidden");
      dashboard.classList.remove("hidden");
      showMessage(dashboardMessage, "Admin data load ho raha hai…");

      try {
        await Promise.all([loadUsers(), loadReports()]);
        showMessage(dashboardMessage, "Admin data load ho gaya.", "success");
      } catch (error) {
        showMessage(dashboardMessage, error.message, "error");
      }
    }

    document.getElementById("loginForm").addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        const button = document.getElementById("loginButton");
        button.disabled = true;
        showMessage(loginMessage, "Login ho raha hai…");

        try {
          await login(
            document.getElementById("adminEmail").value.trim(),
            document.getElementById("adminPassword").value
          );
        } catch (error) {
          showMessage(loginMessage, error.message, "error");
        } finally {
          button.disabled = false;
        }
      }
    );

    document.getElementById("logoutButton").addEventListener("click", () => {
      localStorage.removeItem("campusFindToken");
      localStorage.removeItem("campusFindUser");
      dashboard.classList.add("hidden");
      loginPanel.classList.remove("hidden");
      document.getElementById("loginForm").reset();
    });

    document.getElementById("users").addEventListener("click", async event => {
      const statusButton = event.target.closest("[data-account-status]");
      const resetButton = event.target.closest("[data-reset-user]");

      try {
        if (statusButton) {
          await apiRequest(
            "/api/auth/admin/users/" +
              encodeURIComponent(statusButton.dataset.userId) +
              "/status",
            {
              method: "PATCH",
              body: JSON.stringify({
                accountStatus: statusButton.dataset.accountStatus
              })
            }
          );

          await loadUsers();
        }

        if (resetButton) {
          const newPassword = prompt(
            "Naya password dalo (kam se kam 8 characters):"
          );

          if (newPassword === null) return;

          if (newPassword.length < 8) {
            alert("Password kam se kam 8 characters ka hona chahiye.");
            return;
          }

          await apiRequest(
            "/api/auth/admin/users/" +
              encodeURIComponent(resetButton.dataset.resetUser) +
              "/password",
            {
              method: "PATCH",
              body: JSON.stringify({ newPassword })
            }
          );

          alert("Password reset ho gaya. Student ko naya password privately batao.");
        }
      } catch (error) {
        alert(error.message);
      }
    });

    document.getElementById("reports").addEventListener("click", async event => {
      const button = event.target.closest("[data-review-status]");

      if (!button) return;

      try {
        await apiRequest(
          "/api/items/admin/" +
            encodeURIComponent(button.dataset.itemId) +
            "/review",
          {
            method: "PATCH",
            body: JSON.stringify({
              reviewStatus: button.dataset.reviewStatus
            })
          }
        );

        await loadReports();
      } catch (error) {
        alert(error.message);
      }
    });

    if (getToken()) {
      openDashboard();
    }
  </script>
</body>
</html>
