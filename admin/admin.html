<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Control Panel | Poornima University</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: #1e3a8a;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 22px;
        }

        .navbar span {
            font-size: 14px;
            opacity: 0.9;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #666;
        }

        /* =========================
           STATISTICS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            color: #666;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 30px;
            font-weight: bold;
            color: #1e3a8a;
        }

        /* =========================
           ITEMS TABLE
        ========================= */

        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            vertical-align: middle;
        }

        tr:hover {
            background: #f8fafc;
        }

        /* =========================
           IMAGE
        ========================= */

        .item-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        /* =========================
           BADGES
        ========================= */

        .badge {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .lost {
            background: #fee2e2;
            color: #b91c1c;
        }

        .found {
            background: #dcfce7;
            color: #15803d;
        }

        .active {
            background: #dbeafe;
            color: #1d4ed8;
        }

        /* =========================
           DELETE BUTTON
        ========================= */

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        /* =========================
           EMPTY MESSAGE
        ========================= */

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 15px;
            }

            .container {
                width: 95%;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<div class="navbar">

    <h1>
        🎓 Poornima University
    </h1>

    <span>
        Admin Control Panel
    </span>

</div>


<!-- =========================
     MAIN CONTAINER
========================= -->

<div class="container">


    <div class="page-title">

        <h2>
            Admin Dashboard
        </h2>

        <p>
            Manage Lost & Found items submitted by students.
        </p>

    </div>


    <!-- =========================
         STATISTICS
    ========================= -->

    <div class="stats">

        <div class="stat-card">

            <h3>
                Total Items
            </h3>

            <div
                class="number"
                id="totalItems"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>
                Lost Items
            </h3>

            <div
                class="number"
                id="lostItems"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>
                Found Items
            </h3>

            <div
                class="number"
                id="foundItems"
            >
                0
            </div>

        </div>

    </div>


    <!-- =========================
         ITEMS TABLE
    ========================= -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>
                        Image
                    </th>

                    <th>
                        Type
                    </th>

                    <th>
                        Item
                    </th>

                    <th>
                        Category
                    </th>

                    <th>
                        Location
                    </th>

                    <th>
                        Student
                    </th>

                    <th>
                        Contact
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="itemsTable">

                <tr>

                    <td
                        colspan="9"
                        class="loading"
                    >
                        Loading items...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


</div>


<script>

/*
====================================
API URL
====================================
*/

const API_URL =
    "http://localhost:5000/api/items";


/*
====================================
LOAD ITEMS
====================================
*/

async function loadAdminItems() {

    try {

        const response =
            await fetch(API_URL);

        const items =
            await response.json();


        if (!response.ok) {

            throw new Error(
                "Unable to load items"
            );

        }


        /*
        ================================
        UPDATE STATISTICS
        ================================
        */

        document.getElementById(
            "totalItems"
        ).textContent = items.length;


        document.getElementById(
            "lostItems"
        ).textContent =
            items.filter(
                item => item.type === "Lost"
            ).length;


        document.getElementById(
            "foundItems"
        ).textContent =
            items.filter(
                item => item.type === "Found"
            ).length;


        /*
        ================================
        TABLE
        ================================
        */

        const table =
            document.getElementById(
                "itemsTable"
            );


        table.innerHTML = "";


        if (items.length === 0) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="9"
                        class="empty"
                    >

                        No Lost & Found items
                        available.

                    </td>

                </tr>

            `;

            return;

        }


        /*
        ================================
        CREATE TABLE ROWS
        ================================
        */

        items.forEach(item => {


            const row =
                document.createElement("tr");


            /*
            IMAGE
            */

            const imageHTML =
                item.image

                ? `
                    <img
                        src="${item.image}"
                        class="item-image"
                        alt="${item.itemName}"
                    >
                  `

                : "📦";


            /*
            TYPE BADGE
            */

            const typeClass =
                item.type === "Lost"
                    ? "lost"
                    : "found";


            /*
            STATUS
            */

            const statusClass =
                item.status === "Active"
                    ? "active"
                    : "";


            row.innerHTML = `

                <td>

                    ${imageHTML}

                </td>


                <td>

                    <span
                        class="badge ${typeClass}"
                    >

                        ${item.type}

                    </span>

                </td>


                <td>

                    <strong>
                        ${item.itemName}
                    </strong>

                </td>


                <td>

                    ${item.category}

                </td>


                <td>

                    📍 ${item.location}

                </td>


                <td>

                    ${item.studentName}

                </td>


                <td>

                    ${item.studentContact}

                </td>


                <td>

                    <span
                        class="badge ${statusClass}"
                    >

                        ${item.status}

                    </span>

                </td>


                <td>

                    <button
                        class="delete-btn"
                        onclick="deleteItem('${item._id}')"
                    >

                        Delete

                    </button>

                </td>

            `;


            table.appendChild(row);

        });


    }

    catch (error) {

        console.error(
            "Error loading admin items:",
            error
        );

        document.getElementById(
            "itemsTable"
        ).innerHTML = `

            <tr>

                <td
                    colspan="9"
                    class="empty"
                >

                    ❌ Unable to load items.

                    <br><br>

                    Make sure the backend
                    server is running.

                </td>

            </tr>

        `;

    }

}


/*
====================================
DELETE ITEM
====================================
*/

async function deleteItem(id) {


    const confirmation =
        confirm(
            "Are you sure you want to delete this item?"
        );


    if (!confirmation) {

        return;

    }


    try {


        const response =
            await fetch(
                `${API_URL}/admin/${id}`,
                {
                    method: "DELETE"
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Delete failed"
            );

        }


        alert(
            "Item deleted successfully!"
        );


        /*
        Reload admin table
        */

        loadAdminItems();


    }

    catch (error) {

        console.error(
            "Delete error:",
            error
        );

        alert(
            "Error deleting item: " +
            error.message
        );

    }

}


/*
====================================
LOAD WHEN PAGE OPENS
====================================
*/

document.addEventListener(
    "DOMContentLoaded",
    loadAdminItems
);

</script>


</body>

</html>
